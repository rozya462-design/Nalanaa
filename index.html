<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для подруги</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:white;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

h1{
    position:absolute;
    top:30px;
    text-align:center;
    color:black;
    font-size:22px;
    max-width:900px;
    padding:0 20px;
}

canvas{
    display:block;
}

#nextBtn{
    position:absolute;
    bottom:40px;
    padding:15px 40px;
    border:none;
    border-radius:12px;
    background:#444;
    color:white;
    font-size:18px;
    cursor:pointer;
    display:none;
}
</style>
</head>

<body>

<h1>Мы лучшие подруги уже 2 года, и я этому безумно рада</h1>

<canvas id="canvas"></canvas>

<button id="nextBtn" onclick="location.href='photos.html'">Дальше</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, scale;

function resize(){
    const dpr = window.devicePixelRatio || 1;

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min(W, H) / 30; // ключ к нормальному виду на телефоне

    initParticles();
}
window.addEventListener("resize", resize);

const particles = [];
let progress = 0;

function initParticles(){
    particles.length = 0;

    for(let t = 0; t < Math.PI * 2; t += 0.05){

        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t)
                 - 5 * Math.cos(2*t)
                 - 2 * Math.cos(3*t)
                 - Math.cos(4*t));

        particles.push({
            tx: W/2 + x * scale,
            ty: H/2 + y * scale,
            x: Math.random() * W,
            y: Math.random() * H,
            alpha: 0
        });
    }

    progress = 0;
}

function animate(){
    ctx.clearRect(0,0,W,H);

    for(let i=0;i<particles.length;i++){
        if(i < progress){

            const p = particles[i];

            p.x += (p.tx - p.x) * 0.05;
            p.y += (p.ty - p.y) * 0.05;

            p.alpha = Math.min(1,p.alpha + 0.02);

            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = "red";
            ctx.font = "18px Arial";
            ctx.fillText("I love you", p.x, p.y);
        }
    }

    ctx.globalAlpha = 1;

    if(progress < particles.length){
        progress += 2;
    }else{
        document.getElementById("nextBtn").style.display = "block";
    }

    requestAnimationFrame(animate);
}

resize();
animate();
</script>

</body>
</html>
